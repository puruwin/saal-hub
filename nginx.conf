server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy para la API del backend
    # Opciones según tu configuración:
    # - Docker Compose: usar nombre del servicio (ej: backend:3000)
    # - Misma máquina Linux: usar 172.17.0.1:3000 (gateway Docker por defecto)
    # - Otra máquina: usar IP real (ej: 192.168.1.135:3000)
    location /api/ {
        proxy_pass http://172.17.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Eliminar headers de CORS para que el backend no rechace
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}